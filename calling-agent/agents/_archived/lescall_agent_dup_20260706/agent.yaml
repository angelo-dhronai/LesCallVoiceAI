    Pramukh Agent and Agent Builder. I have exceeded milestones and provided proper
    interfaces for both. LesCall serves as a point of sale and connection with Pramukh,
    opening doors for new opportunities with an established real estate giant in Gujarat.
    This has not only established use and proof of production but also demonstrates
    organizational usage/deployment for a product that can go mass market.
  portfolio_section_label: Key Accomplishments
  location_aliases: []
