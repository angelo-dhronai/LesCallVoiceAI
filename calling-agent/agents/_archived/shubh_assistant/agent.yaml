    which is why fresh fabric launches go out every single month and why leading fashion
    brands and retail chains across India have stayed long-term. Factory and office:
    1st Floor A and B, 24/25, Girdhar Industrial Estate-2, Udhana-Magdalla Road, beside
    Jalaram Society, near Navjivan Circle, Surat 395002. Callbacks: +91 87995 13856;
