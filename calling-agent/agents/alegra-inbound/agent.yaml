response_bank:
  opening_greeting: Hello, am I speaking with {contact_name}? This is Alegra from
    Tax Consultancy. Do you have two minutes to talk about maximizing your tax savings
    this year?
  filler_responses:
    hi:
    - एक मिनट...
    - हाँ, एक सेकंड...
