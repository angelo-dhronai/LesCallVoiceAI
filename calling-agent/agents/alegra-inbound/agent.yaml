  objection_playbook:
  - id: already_have_ca
    answer:
      hi: यह तो बहुत अच्छी बात है! हमारे कई ग्राहकों के पास पहले से सीए हैं। हम आपके
        पिछले साल के रिटर्न का एक फ्री सेकंड-ओपिनियन रिव्यू देते हैं ताकि यह सुनिश्चित
        हो सके कि कोई टैक्स डिडक्शन छूट तो नहीं गया। इसमें कोई बाध्यता नहीं है।
      en: That is great! Many of our clients have existing CAs too. We actually offer
        a free second-opinion review of your previous year's filing to ensure no deductions
        or tax-saving opportunities were missed. There is absolutely no obligation.
    patterns:
    - already have a ca
    - already have an accountant
    - mera ca hai
    - apna ca hai
  - patterns:
    - too expensive
    - mehenga hai
    - high price
    - fees too high
    id: too_expensive
    answer:
      hi: हमारी सेवाएं बहुत ही किफायती हैं, आईटीआर फाइलिंग सिर्फ ₹999 से शुरू होती
        है। अक्सर, हमारे सीए आपके लिए जो टैक्स बचत और रिफंड ढूंढते हैं, वह हमारी फीस
        से कहीं अधिक होती है।
      en: Our services are designed to be highly affordable, with ITR filing starting
        at just ₹999. Often, the tax savings and refunds our CAs find for you are
        much higher than our fee, making it a net gain for you.
  - patterns:
    - no time
    - busy right now
    - baad mein baat karenge
    - time nahi hai
    answer:
      en: I completely understand you are busy. Our process is entirely online and
        takes less than 5 minutes of your time—you just upload your documents and
        our CAs handle the rest. Would it be okay if we send a quick tax-saving checklist
        on WhatsApp for now?
      hi: मैं समझ सकता हूँ कि आप व्यस्त हैं। हमारी प्रक्रिया पूरी तरह से ऑनलाइन है
        और इसमें 5 मिनट से भी कम समय लगता है—आप बस अपने दस्तावेज़ अपलोड करते हैं और
        हमारे सीए बाकी काम संभाल लेते हैं। क्या मैं अभी के लिए व्हाट्सएप पर एक त्वरित
        टैक्स-सेविंग चेकलिस्ट भेज सकता हूँ?
    id: no_time
  closing_responses:
    hi: अपना समय देने के लिए धन्यवाद, और आपसे फिर बात करने की उम्मीद है। आपका दिन
      शुभ हो!
    en: Thanks for your time and looking forward to speaking with you again. Have
      a great day!
  canned_phrases:
  - patterns:
    - specific tax advice
    - complex tax question
    - how much tax can i save
    responses:
      hi: मुझे इसके बारे में हमारे टैक्स एक्सपर्ट्स से कन्फर्म करना होगा और वे आपसे
        संपर्क करेंगे।
      en: I will need to confirm that with our tax experts and have them get back
        to you.
  ai_disclosure_responses: {}
