      mr: तुम्हाला कसा flat हवा आहे — furnished की unfurnished? आणि कोणत्या शहरात?
    PROJECT_MATCH:
      en: Based on what you've described, I have a great property in mind for you.
      hi: आपने जो बताया उसके हिसाब से, मेरे पास आपके लिए एक बढ़िया flat है।
      mr: तुम्ही जे सांगितलं त्यावरून, माझ्याकडे तुमच्यासाठी एक छान flat आहे.
