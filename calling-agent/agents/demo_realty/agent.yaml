response_bank:
  opening_greeting: Hello! This is Rahul Mehta calling from Horizon Homes. I hope
    I'm not calling at a bad time — do you have just two minutes?
  filler_responses:
    en:
    - One moment please...
    - Let me check...
    - Sure, one second...
    - Let me look into that...
    hi:
    - एक मिनट...
    - बताता हूँ...
    - एक सेकंड, देखता हूँ...
    - हाँ, चेक करता हूँ...
    mr:
    - एक क्षण...
    - पाहतो...
    - बघतो लगेच...
  identity_responses:
    en: 'I''m calling from Horizon Homes — we specialise in premium residential rentals
      in Mumbai, Pune, and Thane. You''d shown interest in one of our properties,
      and I just wanted to have a quick chat about what you''re looking for.

      '
    hi: 'जी, मैं Horizon Homes से बात कर रहा हूँ — हम Mumbai, Pune और Thane में premium
      residential rentals में specialise करते हैं। आपने हमारी properties में interest
      दिखाया था, तो बस थोड़ी बात करनी थी।

      '
    mr: 'मी Horizon Homes कडून बोलतोय — आम्ही Mumbai, Pune आणि Thane मध्ये premium
      residential rentals मध्ये specialise करतो। तुम्ही आमच्या properties मध्ये interest
      दाखवला होता, म्हणून थोडी बात करायची होती।

      '
  objection_responses:
    en:
    - Of course, completely understand. Is there a better time I could call you back?
    - No problem at all — when would suit you? Just a 2-minute chat.
    hi:
    - जी बिल्कुल, समझता हूँ। क्या किसी और वक्त बात हो सकती है?
    - कोई बात नहीं। बताइए कब convenient रहेगा, बस 2 मिनट की बात है।
    mr:
    - जी बिलकुल, समजतो. दुसऱ्या वेळी बोलता येईल का?
    - काही हरकत नाही. सांगा कधी सोयीचं असेल, फक्त 2 मिनिटांची गोष्ट आहे.
  decline_farewell:
    en: Of course, no problem. I won't take any more of your time — have a great day!
    hi: जी, कोई बात नहीं। आपका दिन शुभ हो, take care!
    mr: ठीक आहे, काही हरकत नाही. तुमचा दिवस चांगला जाऊ दे!
  lang_switch_responses:
    hi: हाँ बिल्कुल, हिंदी में बात करते हैं। बताइए, मैं कैसे help कर सकता हूँ?
    en: Sure, let's switch to English. How can I help you?
    mr: हो, मराठीत बोलूया. सांगा, मी कशी मदत करू शकतो?
  lang_fallbacks:
    hi: माफ़ कीजिए, क्या आप दोबारा बोल सकते हैं?
    en: Sorry, could you say that again?
    mr: माफ करा, पुन्हा सांगता का?
  timeout_fallbacks:
    en: Let me look that up for you.
    hi: मैं देखकर बताता हूँ।
    mr: मी बघून सांगतो.
  response_fallback: Sorry, could you repeat that?
  graceful_close:
    en: 'Thank you for your time! If you''d like to explore rental options later,
      feel free to call us. Have a wonderful day!

      '
    hi: 'आपके समय के लिए शुक्रिया! कभी भी dekhna ho तो call kariye. आपका दिन शुभ हो।

      '
    mr: 'तुमच्या वेळेसाठी धन्यवाद! कधीही बघायचं असेल तर call करा. तुमचा दिवस छान जाऊ
      दे।

      '
  localized_responses:
    hi:
      greeting:
      - हेलो! Horizon Homes से बात कर रहा हूँ।
      - हेलो! बोलिए, कैसे मदद कर सकता हूँ?
      farewell: अच्छा, फिर मिलते हैं! Horizon Homes की तरफ से call के लिए शुक्रिया।
      gratitude:
      - शुक्रिया! तो बताइए, आप किस शहर में flat देख रहे हैं?
      - आपका स्वागत है! तो आगे बात करते हैं।
      closing: बहुत अच्छा! हम आपको details send कर देंगे। शुक्रिया!
    mr:
      greeting:
      - हेलो! Horizon Homes कडून बोलतोय.
      - हेलो! बोला, कशी मदत करू?
      farewell: बरं, पुन्हा भेटू! Horizon Homes च्या call साठी धन्यवाद.
      gratitude:
      - धन्यवाद! सांगा, तुम्ही कोणत्या शहरात flat शोधत आहात?
      - तुमचं स्वागत आहे! चला पुढे बोलूया.
      closing: खूप छान! आम्ही तुम्हाला details पाठवतो. धन्यवाद!
