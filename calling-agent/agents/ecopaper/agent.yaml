response_bank:
  opening_greeting: Hello! I'm Ecopaper. How can I help you today?
  filler_responses:
    hi:
    - एक मिनट...
    - हाँ, एक सेकंड...
    en:
    - One moment please...
    - Sure, one second...
  identity_responses: {}
  objection_responses:
    en:
    - I understand your concerns, but our products are made from sustainable materials
      and are perfect for gifting.
    - We offer a 100% satisfaction guarantee, so you can try our products risk-free.
    hi:
    - मैं आपकी चिंताओं को समझता हूँ, लेकिन हमारे उत्पाद स्थायी सामग्री से बने हैं
      और गिफ्टिंग के लिए उपयुक्त हैं।
    - हम 100% संतुष्टि गारंटी प्रदान करते हैं, ताकि आप हमारे उत्पादों को जोखिम मुक्त
      आजमा सकें।
  decline_farewell:
    hi: कोई बात नहीं, आपके समय के लिए धन्यवाद। आपका दिन शुभ रहे!
    en: No problem at all — thank you for your time, have a great day!
  lang_switch_responses:
    hi: जी बिल्कुल, हम हिंदी में बात करते हैं।
    en: Sure, let's continue in English.
  lang_fallbacks:
    hi: माफ़ कीजिए, क्या आप दोबारा बोल सकते हैं?
    en: Sorry, could you repeat that?
  timeout_fallbacks:
    hi: मैं इस पर वापस आती हूँ।
    en: Let me get back to you on that.
  response_fallback: Sorry, could you repeat that?
  graceful_close:
    hi: आपके समय के लिए बहुत धन्यवाद! आपका दिन शुभ हो।
    en: Thank you so much for your time. Have a wonderful day!
  localized_responses: {}
  proactive_prompts: {}
  decline_responses: {}
  slots_prompt: {}
