response_bank:
  opening_greeting: Hi! Welcome to FitCoach AI, your personal fitness coach. Whether
    your goal is to lose weight, build muscle, improve your health, or simply feel
    more confident, I'm here to help you find the perfect plan. What's your biggest
    fitness goal today?
  filler_responses:
    en:
    - One moment please...
    - Sure, one second...
  identity_responses: {}
  objection_responses:
    en:
    - I completely understand. Many of our members have busy schedules too. We can
      design workouts that take as little as 20–30 minutes a day.
    - That's more common than you think. Success isn't about never failing—it's about
      finding a plan that's realistic and sustainable for you.
    - No worries at all. We offer home workout plans that require little or no equipment,
      so you can build confidence before stepping into a gym if you choose.
    - Healthy eating doesn't have to be expensive. We focus on practical, budget-friendly
      meal options using everyday ingredients.
    - It's never too late to improve your health. We'll tailor the program to your
      current fitness level and progress at a pace that's safe and comfortable.
  decline_farewell:
    en: No problem at all — thank you for your time, have a great day!
  lang_switch_responses:
    en: Sure, let's continue in English.
  lang_fallbacks:
    en: Sorry, could you repeat that?
  timeout_fallbacks:
    en: Let me get back to you on that.
  response_fallback: Sorry, could you repeat that?
  graceful_close:
    en: Thank you so much for your time. Have a wonderful day!
  localized_responses: {}
  proactive_prompts: {}
  decline_responses: {}
  slots_prompt: {}
  objection_playbook:
  - id: time_objection
    patterns:
    - i don't have time
    - busy schedule
    answer:
      en: I completely understand. Many of our members have busy schedules too. We
        can design workouts that take as little as 20–30 minutes a day.
  - id: failure_objection
    patterns:
    - i've failed before
    answer:
      en: That's more common than you think. Success isn't about never failing—it's
        about finding a plan that's realistic and sustainable for you.
  - id: gym_intimidation_objection
    patterns:
    - the gym intimidates me
    answer:
      en: No worries at all. We offer home workout plans that require little or no
        equipment, so you can build confidence before stepping into a gym if you choose.
  - id: cost_objection
    patterns:
    - healthy food is expensive
    answer:
      en: Healthy eating doesn't have to be expensive. We focus on practical, budget-friendly
        meal options using everyday ingredients.
  - id: age_objection
    patterns:
    - i'm too old to start
    answer:
      en: It's never too late to improve your health. We'll tailor the program to
        your current fitness level and progress at a pace that's safe and comfortable.
  closing_responses:
    en: Excellent choice! You're taking an important step toward a healthier, stronger
      version of yourself. I'll help you get everything set up so you can begin your
      fitness journey with confidence. We look forward to being part of your transformation!
  canned_phrases: []
