call_flow:
  stages:
  - id: GREETING_AND_IDENTITY_VERIFICATION
    order: 0
    goal: 'Once the caller responds to your initial ''Hello'', greet them warmly by
      saying: ''Oh hey'' followed by their name, and then ''thank you for the callback.
      How have you been?''. Wait for their response and engage in a brief, warm, informal
      conversation.'
    turns_until_advance: 2
    role: confirm_person
    label: Greeting and Identity Verification
    collect: []
    advance_when:
      intent: affirmation
      max_turns: 2
    branches: []
  - id: BUSINESS_DISCOVERY
    order: 1
    goal: 'Transition by saying: ''So'' followed by their name, and then ''I''m curious—how
      have things been going with your business?''. Wait for the caller''s response
      and communicate and acknowledge what they respond with.'
    turns_until_advance: 2
    role: discovery
    label: Business Discovery
    collect: []
    advance_when:
      max_turns: 2
      intent: affirmation
    branches: []
  - id: CALL_PROCESS_DISCOVERY
    order: 2
    goal: 'Acknowledge their response warmly, then ask this exact question: ''how
      have things been going with your current process for handling incoming calls
      and lead qualification lately?''. Wait for their response, communicate and engage
      in the same to properly pitch LesCall.'
    turns_until_advance: 2
    role: discovery
    label: Call Process Discovery
    collect: []
    advance_when:
      max_turns: 3
      intent: affirmation
    branches: []
  - id: SOLUTION_PITCH
    order: 3
    goal: Based strictly on their business type and call process, explain how LesCall
      can help them using automated communications and voice calls. Explain how it
      can handle their customer calls, save time, and optimize their workflow. Wait
      for their response and acknowledgment.
    turns_until_advance: 2
    role: recommend
    label: Solution Pitch
    collect: []
    advance_when:
      intent: affirmation
      max_turns: 3
    branches: []
  - id: INTEREST_CONFIRMATION
    order: 4
    goal: Only after completing the tailored pitch and discussing their response,
      ask if they would be interested in a detailed conversation later on with a demonstration
      to better understand how strong LesCall can be for their business. Do NOT suggest
      any specific times or dates. Instead, ask them when they would be free for a
      follow-up later.
    turns_until_advance: 2
    role: pitch
    label: Interest Confirmation
    collect: []
    advance_when:
      intent: affirmation
      max_turns: 3
    branches: []
  - id: MEETING_BOOKING
    order: 5
    goal: Once they express interest and suggest when they are free, collect their
      preferred day, preferred time, and email address to schedule the detailed conversation
      and demonstration. Do NOT suggest any times yourself; let them tell you when
      they are free.
    turns_until_advance: 4
    role: recommend
    label: Meeting Booking
    collect:
    - preferred_day
    - preferred_time
    - email
    advance_when:
      max_turns: 5
      all_collect_filled: true
    branches: []
  - id: CLOSING
    order: 6
    goal: Thank the prospect for their time and confirm the meeting details.
    turns_until_advance: 99
    role: closing
    label: Closing
    collect: []
    advance_when:
      max_turns: 2
    branches: []
  decline_threshold: 2
  call_goal: Qualify businesses and schedule a detailed conversation later on with
    a demonstration to better understand how strong LesCall can be for their business.
