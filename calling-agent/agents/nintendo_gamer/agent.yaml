  portfolio_prompt_text: 'NINTENDO SWITCH CONSOLE CATALOGUE — GameZone India


    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    1. NINTENDO SWITCH OLED — ₹34,999  (Premium Pick)

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    Screen   : 7-inch vibrant OLED — colours and contrast are stunning

    Storage  : 64GB internal (expandable via microSD)

    Battery  : 4.5 to 9 hours playtime

    Modes    : TV Mode + Tabletop Mode + Handheld Mode (all three)

    Extras   : Enhanced stereo speakers, wide adjustable kickstand, wired LAN port
    in dock

    Joy-Cons : Detachable — two people can play with one each

    Best for : Gamers who want the best visual experience; frequent travellers; adults
    buying for themselves

    Pitch    : "The OLED screen makes Zelda and Mario look absolutely cinematic —
    once you see it, you cannot go back."


    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    2. NINTENDO SWITCH (STANDARD V2) — ₹29,999  (Best Seller)

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    Screen   : 6.2-inch LCD display

    Storage  : 32GB internal (expandable via microSD)

    Battery  : 4.5 to 9 hours (V2 improved battery vs original)

    Modes    : TV Mode + Tabletop Mode + Handheld Mode (all three)

    Joy-Cons : Detachable — full multiplayer support out of the box

    Best for : First-time Switch buyers; families; anyone who mainly plays on TV

    Pitch    : "The complete Nintendo experience at a great price — TV play, handheld,
    multiplayer, everything included."


    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    3. NINTENDO SWITCH LITE — ₹19,999  (Budget Champion)

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    Screen   : 5.5-inch LCD (compact, pocket-friendly)

    Storage  : 32GB internal (expandable via microSD)

    Battery  : 3 to 7 hours

    Modes    : Handheld ONLY — cannot connect to TV

    Controls : Built-in non-detachable — lighter at 275g vs 398g for OLED

    Best for : Kids; gifting; budget buyers; commuters and travellers; dedicated handheld
    players

    Pitch    : "Lighter, tougher, and a full Nintendo experience in your pocket —
    perfect for kids or if you''re always on the go."

    IMPORTANT: Never tell a caller the Lite connects to TV — it does NOT.


    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    TOP GAMES TO RECOMMEND — match to caller''s taste

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    Action/Adventure : The Legend of Zelda: Breath of the Wild, Tears of the Kingdom

    Racing           : Mario Kart 8 Deluxe (great for parties and all ages)

    Pokemon          : Pokemon Scarlet & Violet, Pokemon Legends: Arceus

    Casual/Family    : Animal Crossing: New Horizons

    Fighting         : Super Smash Bros. Ultimate

    Shooter          : Splatoon 3

    Platformer       : Super Mario Odyssey, Super Mario Bros. Wonder


    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    ACCESSORIES & ADD-ONS

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    Extra Joy-Con pair             : ₹5,999

    Nintendo Switch Pro Controller : ₹5,499

    microSD 64GB / 128GB / 256GB   : ₹999 – ₹2,499

    Carry cases and screen protectors: ₹499 – ₹1,499

    Nintendo Switch Online (1 year): ₹499 — includes classic game library and cloud
    saves


    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    BUYING OPTIONS

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    In-store demo: Mumbai, Delhi, Bangalore

    Online: pan-India delivery in 2-3 working days

    EMI: 0% for 3 or 6 months on orders above ₹20,000

    '
