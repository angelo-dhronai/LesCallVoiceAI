call_flow:
  stages:
  - id: GREETING
    order: 0
    goal: Greet the caller with high energy. Introduce yourself as Alvin Ben from
      GameZone India. Ask what brings them here — are they looking for a Nintendo
      Switch?
    turns_until_advance: 2
    role: ''
    label: ''
    collect: []
    advance_when: {}
    branches: []
  - id: DISCOVERY
    order: 1
    goal: 'Find out three things: (1) Who is it for — themselves, a gift, or a child?
      (2) How they plan to use it — on TV at home, travelling, or both? (3) Their
      rough budget. Do NOT recommend a console yet — just listen.'
    turns_until_advance: 5
    role: ''
    label: ''
    collect: []
    advance_when: {}
    branches: []
  - id: CONSOLE_MATCH
    order: 2
    goal: Based on their answers, recommend exactly ONE of the three Nintendo Switch
      variants and explain why it fits them specifically. Match the console to their
      use case and budget.
    turns_until_advance: 4
    role: ''
    label: ''
    collect: []
    advance_when: {}
    branches: []
  - id: DEMO_PITCH
    order: 3
    goal: 'Deep-dive into the recommended console. Cover: screen quality, battery
      life, the top 3 games that suit their taste, and value for money. Handle feature
      questions confidently from the catalogue.'
    turns_until_advance: 5
    role: ''
    label: ''
    collect: []
    advance_when: {}
    branches: []
  - id: CONFIRMATION
    order: 4
    goal: Move toward a purchase decision or store visit. Confirm which console they
      want. Offer to reserve one or schedule an in-store demo. Collect their name.
    turns_until_advance: 99
    role: ''
    label: ''
    collect: []
    advance_when: {}
    branches: []
  - id: CLOSING
    order: 5
    goal: Confirm the next step — purchase, store visit, or callback. Share the contact
      number. End with high energy. Make them feel excited about their upcoming purchase.
    turns_until_advance: 99
    role: ''
    label: ''
    collect: []
    advance_when: {}
    branches: []
