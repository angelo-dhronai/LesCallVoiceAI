    to the next level!
  filler_responses:
    en:
    - One moment please...
    - Sure, one second...
  identity_responses: {}
  objection_responses:
    en:
    - I completely understand, but let me ask you, are you tired of mediocre sound
      quality and short battery life? The OnePlus Buds 4 offer flagship-level audio
      and all-day battery life, making them a game-changer for music lovers and busy
      professionals alike.
    - I appreciate your hesitation. Can I offer you a quick comparison with other
      earbuds in the market? The OnePlus Buds 4 provide exceptional value for money
      with their advanced features and premium build, all at an affordable price point
      of ₹5,999.
