response_bank:
  opening_greeting: Hello?
  filler_responses:
    hi:
    - एक मिनट...
    - हाँ, एक सेकंड...
    en:
    - One moment please...
    - Sure, one second...
    gu:
    - એક મિનિટ...
    - હા, એક સેકંડ...
  identity_responses: {}
  objection_responses:
    en:
    - I understand your time is valuable. I will keep this very brief, or if you prefer,
      I can call back at a better time.
    - No problem at all. If you change your mind, feel free to reach out to us anytime.
      Thank you!
    hi:
    - मैं समझ सकता हूँ कि आपका समय कीमती है। मैं इसे बहुत संक्षेप में रखूँगा, या यदि
      आप चाहें तो मैं बाद में कॉल कर सकता हूँ।
    - कोई बात नहीं। अगर आपका विचार बदले, तो आप कभी भी हमसे संपर्क कर सकते हैं। धन्यवाद!
    gu:
    - હું આપનો સમય સમજી શકું છું. હું આ ખૂબ જ ટૂંકમાં પતાવીશ, અથવા જો આપ ઈચ્છો તો
      હું પછીથી ફોન કરી શકું છું.
    - કોઈ વાંધો નહીં. જો આપનો વિચાર બદલાય, તો આપ ગમે ત્યારે અમારો સંપર્ક કરી શકો છો.
      આભાર!
  decline_farewell:
    hi: कोई बात नहीं, आपके समय के लिए धन्यवाद। आपका दिन शुभ रहे!
    en: No problem at all — thank you for your time, have a great day!
    gu: કંઈ વાંધો નહીં, તમારા સમય માટે આભાર. તમારો દિવસ શુભ રહે!
  lang_switch_responses:
    hi: जी बिल्कुल, हम हिंदी में बात करते हैं।
    en: Sure, let's continue in English.
    gu: ચોક્કસ, આપણે ગુજરાતીમાં વાત કરીએ.
  lang_fallbacks:
    hi: माफ़ कीजिए, क्या आप दोबारा बोल सकते हैं?
    en: Sorry, could you repeat that?
    gu: માફ કરશો, ફરી બોલશો?
  timeout_fallbacks:
    hi: मैं इस पर वापस आता हूँ।
    en: Let me get back to you on that.
    gu: હું આના પર પાછો આવું છું.
  response_fallback: Sorry, could you repeat that?
  graceful_close:
    hi: आपके समय के लिए बहुत धन्यवाद! आपका दिन शुभ हो।
    en: Thank you so much for your time. Have a wonderful day!
    gu: તમારા સમય માટે ખૂબ ખૂબ આભાર! તમારો દિવસ શુભ રહે.
  localized_responses: {}
  proactive_prompts: {}
  decline_responses: {}
  slots_prompt: {}
  objection_playbook:
  - id: send_brochure
    patterns:
    - Just send me the brochure
    - WhatsApp me the details
    answer:
      en: Agree immediately and send it. Then note the brochure only tells part of
        the story, and ask if it would be okay to also set up a quick visit.
  - id: price_too_high
    patterns:
    - Price is too high
    - out of my budget
    answer:
      en: Acknowledge fully, then ask what range would feel comfortable. Mention we
        have projects from ₹22 Lakh in Vapi up to ₹70 Lakh in Surat — better to find
        something that actually fits than push something that doesn't.
  - id: discuss_with_family
    patterns:
    - I need to discuss with my family
    - I'll call back
    answer:
      en: Agree that's the right thing to do. Suggest bringing the family to the site
        visit itself so everyone sees it together and the decision gets easier.
  - id: comparing_builders
    patterns:
    - I'm comparing with other builders
    answer:
      en: Affirm that comparing is smart. Ask them not to make a final call until
        they've physically seen ours — comparing on paper and comparing after a visit
        are very different. Mention Pramukh's 30-year track record.
  - id: builder_reliability
    patterns:
    - Is the builder reliable?
    - Will the project get delayed?
    answer:
      en: 'Call it a valid question and one of Pramukh''s strongest points: 60+ projects
        over 30 years, not a single stalled case, and every active project RERA registered
        — the strongest protection a buyer can have.'
  - id: how_got_number
    patterns:
    - How did you get my number?
    - I didn't enquire
    answer:
      en: This is an inbound line, so clarify politely that they called us, and ask
        how we can help.
  closing_responses:
    en: Thank you for your time, I'm looking forward to meeting you at the project.
      Feel free to call or WhatsApp me directly with any questions before the visit.
    hi: आपका धन्यवाद, मैं प्रोजेक्ट पर आपसे मिलने के लिए उत्सुक हूं। किसी भी सवाल
      के लिए मुझसे सीधे कॉल या व्हाट्सएप करें।
    gu: Tamaru dhanyavad, hu project par tamne malva maate utsuk chu. Visit pehla
      koi prashna hoy to direct call ya WhatsApp kari sako cho.
