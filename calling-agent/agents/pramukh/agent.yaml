      डेवलपर हैं। आपने हमारी प्रॉपर्टीज में इंटरेस्ट दिखाया था और इंक्वायरी भी की
      थी। मैं बस आपसे इसके बारे में थोड़ी बात करना चाहता था।
    gu: જી, હું Pramukh Group તરફથી બોલું છું, અમે Gujarat ના જાણીતા રિયલ એસ્ટેટ ડેવલપર
