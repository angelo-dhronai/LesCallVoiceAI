response_bank:
  opening_greeting: Good {current_time}, am I speaking with {contact_name}?
  filler_responses:
    hi:
    - एक मिनट...
    - हाँ, एक सेकंड...
    en:
    - One moment please...
    - Sure, one second...
    gu:
    - એક મિનિટ...
    - હા, એક સેકંડ...
  identity_responses:
    en: My name is Vishal Patel, and I'm a real estate agent from Pramukh Group.
    gu: મારું નામ વિશાલ પટેલ છે, અને હું પ્રમુખ ગ્રુપમાં રિયલ એસ્ટેટ એજન્ટ છું.
    hi: मेरा नाम विशाल पटेल है, और मैं प्रमुख ग्रुप से रियल एस्टेट एजेंट हूँ।
  objection_responses:
    en:
    - No worries, we can definitely look for better options that match your budget
      expectations. We have all sorts of projects and properties, and I'm sure we
      can find the best one for you.
    - Oh, I understand. I would be pleased to know if there are any specific reasons
      for this that I could clarify or help you with. I will be here in case you change
      your mind!
    - Oh, okay, no worries then. I will be available in case the right time comes.
      Hope I did not waste your time. Thank you!
    - I respect how you feel, but here at Pramukh Group, everything that you invest
      in gives you returns in the long term beyond compare. If this does not match
      your property expectations, we can definitely look at other options that fit
      your financial plans.
  decline_farewell:
    hi: कोई बात नहीं, आपके समय के लिए धन्यवाद। आपका दिन शुभ रहे!
    en: No problem at all — thank you for your time, have a great day!
    gu: કંઈ વાંધો નહીં, તમારા સમય માટે આભાર. તમારો દિવસ શુભ રહે!
  lang_switch_responses:
    hi: जी बिल्कुल, हम हिंदी में बात करते हैं।
    en: Sure, let's continue in English.
    gu: ચોક્કસ, આપણે ગુજરાતીમાં વાત કરીએ.
  lang_fallbacks:
    hi: माफ़ कीजिए, क्या आप दोबारा बोल सकते हैं?
    en: Sorry, could you repeat that?
    gu: માફ કરશો, ફરી બોલશો?
  timeout_fallbacks:
    hi: मैं इस पर वापस आती हूँ।
    en: Let me get back to you on that.
    gu: હું આના પર પાછી આવું છું.
  response_fallback: माफ़ कीजिए, क्या आप दोबारा बोल सकते हैं?
  graceful_close:
    hi: आपके समय के लिए बहुत धन्यवाद! आपका दिन शुभ हो।
    en: Thank you so much for your time. Have a wonderful day!
    gu: તમારા સમય માટે ખૂબ ખૂબ આભાર! તમારો દિવસ શુભ રહે.
