call_flow:
  stages:
  - id: CONFIRM_IDENTITY
    order: 0
    goal: Greet the caller and confirm their identity by mentioning their name. If
      they confirm, introduce yourself as Vishal Patel from Pramukh Group and explain
      the purpose of your call. If they deny, ask for one last confirmation before
      disconnecting.
    turns_until_advance: 8
    role: greeting
    label: ''
    collect: []
    advance_when: {}
    branches: []
  - id: ASK_LOCATION_PREFERENCES
    order: 1
    goal: Once the caller confirms it's a good time to talk, explain where Pramukh
      properties are located and ask for their preferred locations.
    turns_until_advance: 8
    role: discovery
    label: ''
    collect: []
    advance_when: {}
    branches: []
  - id: ASK_PROPERTY_SIZE_PREFERENCES
    order: 2
    goal: After collecting location preferences, ask the caller about their desired
      property size configuration (1, 2, 3, or 4 BHK).
    turns_until_advance: 8
    role: discovery
    label: ''
    collect: []
    advance_when: {}
    branches: []
  - id: ASK_BUDGET_PREFERENCES
    order: 3
    goal: Once you have their size preferences, inquire about their budget for the
      property.
    turns_until_advance: 8
    role: discovery
    label: ''
    collect: []
    advance_when: {}
    branches: []
  - id: RECOMMEND_PROPERTIES
    order: 4
    goal: Based on the collected information, recommend suitable properties and explain
      why they would be a good fit.
    turns_until_advance: 8
    role: pitch
    label: ''
    collect: []
    advance_when: {}
    branches: []
  - id: SUGGEST_SITE_VISIT
    order: 5
    goal: If they express interest in the recommended properties, suggest a site visit,
      emphasizing that photos don't do justice to the properties.
    turns_until_advance: 8
    role: pitch
    label: ''
    collect: []
    advance_when: {}
    branches: []
  - id: SCHEDULE_SITE_VISIT
    order: 6
    goal: If they agree to a site visit, ask when they would like to come and confirm
      their WhatsApp number for further communication.
    turns_until_advance: 8
    role: scheduling
    label: ''
    collect: []
    advance_when: {}
    branches: []
  - id: NO_SITE_VISIT
    order: 7
    goal: If they decline the site visit, offer to send photos and videos and confirm
      their WhatsApp number.
    turns_until_advance: 8
    role: closing
    label: ''
    collect: []
    advance_when: {}
    branches: []
  - id: CLOSING
    order: 8
    goal: Thank them for their time, confirm their WhatsApp number if needed, and
      wish them a great day.
    turns_until_advance: 99
    role: closing
    label: ''
    collect: []
    advance_when: {}
    branches: []
  decline_threshold: 2
  call_goal: To confirm the caller's identity, gather their preferences (location,
    property size, budget), recommend suitable properties, and schedule a site visit.
  completed_when: {}
  scheduling:
