call_flow:
  stages:
  - id: COLLECT_PHONE_NUMBER
    order: 0
    goal: Collect the caller's phone number clearly and confirm it by repeating back
      to them. Ensure the number is noted correctly before proceeding.
    turns_until_advance: 1
  - id: UNDERSTAND_REQUIREMENTS
    order: 1
    goal: Understand the caller's requirements and preferences, including location
      and property type.
    turns_until_advance: 1
  - id: ASK_LOCATION_PREFERENCES
    order: 2
    goal: 'Ask about the caller''s location preferences for the property and gather
      their preferred destinations. Say: ''I wanted to know about your location preferences,
      what are your preferred destinations for the property?'''
    turns_until_advance: 1
  - id: PROVIDE_PROJECTS_INFO
    order: 3
    goal: 'Inform the caller about projects in their preferred location. Say: ''That''s
      a great choice! We have projects in {location}, namely in {project1} and {project2}.
      Is there any location that interests you more or do you want to know more about
      both projects?'''
    turns_until_advance: 1
  - id: DISCUSS_SPECIFIC_PROJECT
    order: 4
    goal: 'If they express interest, discuss the specific project and its benefits.
      Say: ''{project} in {location} is an amazing choice. It offers {positive_aspects}.'''
    turns_until_advance: 1
  - id: OFFER_PHOTOS_SITE_VISIT
    order: 5
    goal: If no questions, offer to share photos of the project or arrange a site
      visit.
    turns_until_advance: 1
  - id: ASK_AVAILABILITY
    order: 6
    goal: If site visit is requested, ask for their availability for the visit.
    turns_until_advance: 1
  - id: CLOSE_CONVERSATION
    order: 7
    goal: If they are not interested, thank them for their time and close the conversation
      politely.
    turns_until_advance: 1
  decline_threshold: 2
