# LesCall application services — production containers.
#   docker compose -f deploy/docker-compose.services.yml up -d --build
#
# Design notes:
# - api / runtime / workers share ONE image (deploy/Dockerfile.app) and run on
#   the HOST network: FreeSWITCH dials 127.0.0.1:9000/9001 and nginx proxies
#   127.0.0.1:8080, exactly as before containerization — zero telephony or
#   nginx config changes. Postgres stays in its own compose
#   (docker-compose.postgres.yml) — never recreate the DB container casually.
# - The repo is bind-mounted at /app (code + mutable state: recordings/,
#   agents/, json stores). Deploying code = `docker compose restart <svc>`;
#   rebuilding the image is only needed when requirements.txt changes.
# - Containers run as uid 1000 (angelo) so files keep host ownership; workers
#   join gid 994 (freeswitch) to read CDRs for billing reconciliation.
# - FreeSWITCH, Kamailio, host nginx, and the Sarvam key-rotation scripts
#   intentionally stay on the host (out of scope per plan).

services:
  api:
    image: lescall-app:latest
    build: { context: .., dockerfile: deploy/Dockerfile.app }
    container_name: lescall-api
    network_mode: host
    user: "1000:1000"
    working_dir: /home/angelo/lescall/dashboard
    command: ["python", "server.py"]
    env_file: [.pg_env]
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
      GOOGLE_CLOUD_PROJECT: lescall
    volumes:
      - /home/angelo/lescall:/home/angelo/lescall
      - /home/angelo/.config/gcloud:/gcloud:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: &log
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  runtime:
    image: lescall-app:latest
    build: { context: .., dockerfile: deploy/Dockerfile.app }
    container_name: lescall-runtime
    network_mode: host
    user: "1000:1000"
    # freeswitch group: the record_session WAVs in /tmp/esl_recordings are
    # freeswitch:freeswitch 0660; without this the teardown capture of the
    # two-party recording fails with EACCES (recsync in workers then catches
    # up ~15 min later — recordings appear caller-only in the meantime).
    group_add: ["994"]
    working_dir: /home/angelo/lescall
    command: ["bash", "deploy/runtime_entry.sh"]
    env_file: [.pg_env]
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
      GOOGLE_CLOUD_PROJECT: lescall
      TELEPHONY_MODE: "true"
      # ── Continuation-merge canary (2026-07-23, RUNBOOK §11) ──────────────
      # Pause-tolerant turns + the faster 400ms silence endpoint they enable
      # (was 560ms — a guaranteed 160ms saved per turn). Owner-approved
      # canary; validate on the next test call by grepping ws_audio_receiver
      # for [CONT-MERGE] lines and clean rollbacks. ROLLBACK: delete these
      # two lines and `docker compose up -d runtime` — behavior returns to
      # exactly pre-canary (10 rollback tests + no-filler-replay pin green).
      ENABLE_CONTINUATION_MERGE: "true"
      HARD_FLUSH_SILENCE_FRAMES: "20"
    volumes:
      - /home/angelo/lescall:/home/angelo/lescall
      - /home/angelo/.config/gcloud:/gcloud:ro
      - /tmp/esl_recordings:/tmp/esl_recordings
      # TTS playback WAVs: the bridge writes them, socket_server passes the
      # path to FreeSWITCH on the HOST — must be the same directory or every
      # call is silent (FILE NOT FOUND). Learned the hard way 2026-07-14.
      - /tmp/ai_telephony_playback:/tmp/ai_telephony_playback
    restart: unless-stopped
    healthcheck:
      # Process liveness via pidfiles — NEVER a TCP probe: raw connects to
      # 9000/9001 trip socket_server's per-connection ESL logic and the WS
      # server's handshake-error logging every 30s (learned the hard way).
      test: ["CMD", "bash", "-c", "kill -0 $(cat /tmp/socket_server.pid) && kill -0 $(cat /tmp/ws_audio_receiver.pid)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging: *log

  workers:
    image: lescall-app:latest
    build: { context: .., dockerfile: deploy/Dockerfile.app }
    container_name: lescall-workers
    network_mode: host
    user: "1000:1000"
    group_add: ["994"]   # freeswitch — read CDR csv for billing reconciliation
    working_dir: /home/angelo/lescall
    command: ["bash", "deploy/workers_entry.sh"]
    env_file: [.pg_env]
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
      GOOGLE_CLOUD_PROJECT: lescall
    volumes:
      - /home/angelo/lescall:/home/angelo/lescall
      - /home/angelo/.config/gcloud:/gcloud:ro
      - /var/log/freeswitch/cdr-csv:/var/log/freeswitch/cdr-csv:ro
      # FS record_session staging: recsync catch-up copies full two-party
      # recordings from here; cleanup_local prunes stragglers (needs rw).
      - /tmp/esl_recordings:/tmp/esl_recordings
    restart: unless-stopped
    logging: *log

  spa:
    image: lescall-dashboard:latest
    build: { context: ../frontend }
    container_name: lescall-dashboard
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8081:80"]
    restart: unless-stopped
    logging: *log
