# agent.lescall.dhronai.com -> frontend Docker container (lescall-dashboard) on 127.0.0.1:8081
# /api, /auth, /login and /static go straight to the FastAPI backend (:8080).
# The SPA itself sits behind an auth_request login wall backed by FastAPI
# sessions: /api/auth/me returns 200 with a valid session (or in single-tenant
# mode, i.e. before OAuth is configured — the wall is then a no-op) and 401
# otherwise, which nginx turns into a redirect to the branded /login page.
# Install: /etc/nginx/sites-enabled/agent.lescall  (see deploy/RUNBOOK.md §5)
server {
    server_name agent.lescall.dhronai.com;

    # Agent Builder document uploads (PDF/DOCX) can exceed the 1 MB default.
    client_max_body_size 25m;

    # ---- internal session probe (auth_request) ----
    location = /_lescall_auth_probe {
        internal;
        proxy_pass http://127.0.0.1:8080/api/auth/me;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Content-Length    "";
        proxy_pass_request_body off;
    }

    # ---- login surface: FastAPI backend, no wall ----
    location /auth/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /login {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- API + backend static pages: FastAPI direct (its own gate 401s).
    #      Skipping the container hop also keeps SSE single-proxied. ----
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # SSE (/api/.../stream) friendly
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
    }
    location /static/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- the SPA, behind the wall ----
    location / {
        auth_request /_lescall_auth_probe;
        error_page 401 403 = @lescall_login;

        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
    }
    location @lescall_login {
        return 302 /login;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/agent.lescall.dhronai.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/agent.lescall.dhronai.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = agent.lescall.dhronai.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name agent.lescall.dhronai.com;
    return 404; # managed by Certbot
}
