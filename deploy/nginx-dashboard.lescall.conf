# Legacy vhost: dashboard.lescall.dhronai.com (dhronai.com DNS records deleted
# 2026-07-25 — the app now lives at agent.lescall.com). Kept only to 301 any
# straggler with cached DNS. Remove this file — and
# `certbot delete --cert-name dashboard.lescall.dhronai.com` — once the cert
# nears expiry; its renewals will fail without DNS, which is expected.
# Install: /etc/nginx/sites-enabled/dashboard.lescall
server {
    server_name dashboard.lescall.dhronai.com;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dashboard.lescall.dhronai.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dashboard.lescall.dhronai.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://agent.lescall.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.lescall.dhronai.com;
    return 301 https://agent.lescall.com$request_uri;
}
