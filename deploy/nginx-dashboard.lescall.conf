# dashboard.lescall.dhronai.com -> same container/backend as agent.lescall.
# Same login wall; the login redirect points at agent.lescall because that is
# the only host registered as a Google OAuth redirect URI (the session cookie
# is host-scoped, so users should live on agent.lescall once logged in).
# Install: /etc/nginx/sites-enabled/dashboard.lescall
server {
    server_name dashboard.lescall.dhronai.com;

    location = /_lescall_auth_probe {
        internal;
        proxy_pass http://127.0.0.1:8080/api/auth/me;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Content-Length    "";
        proxy_pass_request_body off;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
    }

    location / {
        auth_request /_lescall_auth_probe;
        error_page 401 403 = @lescall_login;

        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
    }
    location @lescall_login {
        return 302 https://agent.lescall.dhronai.com/login;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dashboard.lescall.dhronai.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dashboard.lescall.dhronai.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = dashboard.lescall.dhronai.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name dashboard.lescall.dhronai.com;
    return 404; # managed by Certbot
}
