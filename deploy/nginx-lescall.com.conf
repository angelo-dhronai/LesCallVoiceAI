# lescall.com (+ www) — marketing landing page, served statically from
# /var/www/lescall.com (mirrored 2026-07-25 from the old marketing box at
# 35.207.233.208 when the apex was repointed at this VM; the SPA bundle makes
# zero backend calls, so a static mirror is the whole site).
# Install: /etc/nginx/sites-enabled/lescall.com
# TLS: issued by certbot --nginx once the apex A record resolves to this VM
# (deploy/watch_lescall_apex.sh automates that); certbot appends the 443
# block + HTTPS redirect to the installed copy — sync it back here after.
server {
    listen 80;
    listen [::]:80;
    server_name lescall.com www.lescall.com;

    root /var/www/lescall.com;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite build: hashed asset filenames are immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
