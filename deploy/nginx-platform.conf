# nginx site for the lescall dashboard.
# Serves the built React SPA from dist/ and proxies /api (incl. websockets) to
# the dashboard API on 127.0.0.1:8080. A NEW server block — does not touch the
# existing `lescall` default_server (old dashboard), which keeps serving the IP.
#
# Replace __SERVER_NAME__ with the real FQDN (e.g. platform.lescall.ai).

# Maps the Upgrade header so WebSocket connections (live call monitor) proxy
# correctly. Safe to include once; if another site already defines this map,
# remove this block to avoid a duplicate-map error.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name __SERVER_NAME__;

    root /home/angelo/lescall/dashboard/web/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # API + websockets -> FastAPI backend.
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering    off;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
