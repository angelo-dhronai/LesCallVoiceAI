# lescall — full stack.
#
# Backend services use network_mode: host so the existing hardcoded localhost
# wiring (FreeSWITCH ESL :9000, media WS :9001, playback :9004, API :8080) works
# unchanged. The web container is bridge-networked and published on :8088.
#
# Profiles:
#   default      -> app + dashboard (FreeSWITCH stays on the host)
#   fs-container -> also run FreeSWITCH in a container (verify Dockerfile.freeswitch first)
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml --profile fs-container up -d

services:
  socket_server:
    build: { context: .., dockerfile: docker/Dockerfile.app }
    image: lescall/app
    command: ["python", "socket_server.py"]
    network_mode: host          # FreeSWITCH reaches it on 127.0.0.1:9000 (no NAT)
    user: "1000:994"            # angelo:freeswitch — playback WAVs readable by FS
    env_file: ../calling-agent/.env
    volumes:
      - ../recordings:/app/recordings
      - ../data:/app/data
      - ../credit_log:/app/credit_log
      - /tmp/ai_telephony_playback:/tmp/ai_telephony_playback   # shared with FreeSWITCH
      - /tmp/esl_recordings:/tmp/esl_recordings
    restart: unless-stopped

  ws_audio_receiver:
    image: lescall/app
    build: { context: .., dockerfile: docker/Dockerfile.app }
    command: ["python", "ws_audio_receiver.py", "--sample-rate", "8000"]
    network_mode: host          # receives media on :9001; talks to socket_server :9004
    user: "1000:994"
    env_file: ../calling-agent/.env
    volumes:
      - ../recordings:/app/recordings
      - ../data:/app/data
      - ../credit_log:/app/credit_log
      - ../calling-agent/tts_cache:/app/calling-agent/tts_cache
      - /tmp/ai_telephony_playback:/tmp/ai_telephony_playback   # writes WAVs FS plays
    depends_on: [socket_server]
    restart: unless-stopped

  dashboard_api:
    build: { context: .., dockerfile: docker/Dockerfile.dashboard-api }
    image: lescall/dashboard-api
    network_mode: host          # localhost access to Postgres/Redis + FreeSWITCH ESL :8021
    user: "1000:994"            # angelo:freeswitch — write mounted data/ AND /etc/freeswitch config
    env_file: ../calling-agent/.env
    environment:
      # Live events over Redis; FS control over ESL (no fs_cli binary in the image).
      REDIS_URL: redis://127.0.0.1:6379/0
      FS_ESL_HOST: 127.0.0.1
      FS_ESL_PASSWORD: ClueCon
    volumes:
      - ../recordings:/app/recordings
      - ../data:/app/data
      - ../credit_log:/app/credit_log
      - /etc/freeswitch:/etc/freeswitch   # write generated gateway/dialplan, then ESL reload
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: docker/Dockerfile.web }
    image: lescall/web
    ports:
      - "8088:80"
    depends_on: [dashboard_api]
    restart: unless-stopped

  freeswitch:
    profiles: ["fs-container"]   # opt-in: stop native FS first, then `--profile fs-container up`
    build: { context: .., dockerfile: docker/Dockerfile.freeswitch }
    image: lescall/freeswitch
    network_mode: host           # RTP/SIP like native — no NAT, lowest latency
    volumes:
      - ../recordings:/recordings
      - /tmp/ai_telephony_playback:/tmp/ai_telephony_playback   # WAVs from ws_audio_receiver
      - /tmp/esl_recordings:/tmp/esl_recordings
    restart: unless-stopped
