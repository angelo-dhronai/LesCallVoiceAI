# lescall web (containerized) — TLS terminator + SPA + API proxy.
# Runs with network_mode: host so it binds 80/443 and reaches the dashboard API
# on 127.0.0.1:8080. Let's Encrypt certs mounted read-only from the host.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name platform.lescall.dhronai.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name platform.lescall.dhronai.com;

    ssl_certificate     /etc/letsencrypt/live/platform.lescall.dhronai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.lescall.dhronai.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # API + websockets (live monitor) -> dashboard API container (host networking).
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering    off;
    }

    location / { try_files $uri $uri/ /index.html; }
}
