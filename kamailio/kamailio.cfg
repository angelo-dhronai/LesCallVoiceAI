#!KAMAILIO
#
# lescall — SIP proxy / dispatcher in FRONT of FreeSWITCH
# ---------------------------------------------------------------------------
# Carriers (Plivo, etc.) point their trunks at THIS proxy's public IP:5060.
# Kamailio relays signaling to FreeSWITCH via the `dispatcher` module. RTP/media
# flows DIRECTLY between the carrier and FreeSWITCH (Kamailio is signaling-only).
#
# Backends are in /etc/kamailio/dispatcher.list (setid 1). Adding a 2nd FreeSWITCH
# node later = append a line there + `kamcmd dispatcher.reload`. No redesign.
#
# >>> rtpengine NOTE: today all FreeSWITCH nodes are on THIS host and the carrier
#     is non-NAT (IP-auth trunk), so media flows direct and we do NOT relay it.
#     When media must be relayed (FreeSWITCH nodes on other hosts / behind NAT,
#     or NAT'd endpoints), install `rtpengine`, loadmodule "rtpengine.so", set
#     modparam rtpengine_sock, and call rtpengine_manage() in request_route
#     (offer) + onreply_route (answer). Marked again at those routes below.
# ---------------------------------------------------------------------------

####### Global Parameters #######
debug=2
log_stderror=no
memdbg=5
memlog=5
log_facility=LOG_LOCAL0
fork=yes
children=4

# GCP: bind the private NIC, ADVERTISE the NAT public IP (carriers see public).
listen=udp:10.160.0.6:5060 advertise 35.207.206.252:5060

auto_aliases=no
server_header="Server: lescall-sip"
user_agent_header="User-Agent: lescall-sip"

####### Modules #######
mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/"
loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "xlog.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "dispatcher.so"
loadmodule "pike.so"
loadmodule "siputils.so"
loadmodule "textops.so"

####### Module params #######
# ---- ctl (so kamcmd / kamctl can query dispatcher state) ----
modparam("ctl", "binrpc", "unix:/run/kamailio/kamailio_ctl")

# ---- tm ----
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)

# ---- rr (record-route for in-dialog requests) ----
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 0)

# ---- dispatcher: OPTIONS keepalive marks each FreeSWITCH backend up/down ----
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("dispatcher", "flags", 2)                 # probe with SIP OPTIONS, manage state
modparam("dispatcher", "ds_ping_interval", 30)
modparam("dispatcher", "ds_probing_mode", 1)       # keep probing inactive nodes too
modparam("dispatcher", "ds_ping_from", "sip:kamailio@35.207.206.252")
modparam("dispatcher", "ds_ping_reply_codes", "class=2;code=404;code=405;code=403")

# ---- pike: simple flood/abuse rate limiting per source IP ----
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 80)
modparam("pike", "remove_latency", 4)

####### Routing Logic #######
request_route {

    # --- loop / hop protection ---
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # --- flood protection (pike) ---
    if (!pike_check_req()) {
        xlog("L_ALERT", "[lescall] PIKE flood from $si — blocking\n");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "[lescall] malformed request from $si\n");
        exit;
    }

    # --- in-dialog (has To-tag): just loose-route, no re-auth/redispatch ---
    if (has_totag()) {
        if (loose_route()) {
            t_relay();
            exit;
        }
        if (is_method("ACK")) {
            if (t_check_trans()) { t_relay(); }
            exit;
        }
        sl_send_reply("404", "Not Here");
        exit;
    }

    # --- CANCEL ---
    if (is_method("CANCEL")) {
        if (t_check_trans()) { t_relay(); }
        exit;
    }
    t_check_trans();

    # --- trusted-carrier IP allow-list (FIRST HOP enforcement) ---
    if (is_method("INVITE|REGISTER|SUBSCRIBE|MESSAGE")) {
        route(CARRIER_ACL);
    }

    # --- only initial requests beyond this point ---
    record_route();

    # >>> rtpengine offer would go here: rtpengine_manage("..."); <<<

    route(TO_FREESWITCH);
}

# Relay to a FreeSWITCH backend from dispatcher setid 1 (round-robin, alg 4),
# with automatic failover to the next node if one is down.
route[TO_FREESWITCH] {
    if (!ds_select_dst("1", "4")) {
        xlog("L_ERR", "[lescall] no FreeSWITCH backend available for $rm from $si\n");
        send_reply("503", "Service Unavailable");
        exit;
    }
    xlog("L_INFO", "[lescall] $rm from $si -> FreeSWITCH $du\n");
    t_on_failure("RELAY_FAILOVER");
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# If the chosen FreeSWITCH node fails, try the next one in setid 1.
failure_route[RELAY_FAILOVER] {
    if (t_is_canceled()) { exit; }
    if (ds_next_dst()) {
        t_on_failure("RELAY_FAILOVER");
        t_relay();
        exit;
    }
}

# Trusted carrier signaling sources. Anything not listed is rejected here, at the
# first hop, BEFORE it ever reaches FreeSWITCH (defense in depth on top of FS ACL).
route[CARRIER_ACL] {
    # Local host (FreeSWITCH replies, dispatcher pings) — always allowed.
    if ($si == "127.0.0.1" || $si == "10.160.0.6" || $si == "35.207.206.252") {
        return;
    }
    # ===================== TRUSTED CARRIER IPs (PLACEHOLDER) =====================
    # Replace / append your carrier's SIP signaling IPs below, one per line.
    # Example (Plivo Zentrunk signaling ranges — confirm current values):
    #   if (src_ip == 18.214.109.0/24) return;
    #   if (src_ip == 13.52.9.0/24)   return;
    # if ($si == "1.2.3.4") { return; }
    # ============================================================================
    xlog("L_WARN", "[lescall] REJECT untrusted SIP source $si ($rm)\n");
    sl_send_reply("403", "Forbidden");
    exit;
}

# onreply: (placeholder for rtpengine answer handling when media relay is added)
# onreply_route { ... rtpengine_manage(); ... }
